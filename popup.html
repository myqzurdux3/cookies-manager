<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Cookies Manager</title>
    <link rel="stylesheet" href="/src/ui/popup/popup.css" />
  </head>
  <body>
    <header class="brand">
      <img class="brand-mark" src="icons/logo.svg" alt="" />
      <span class="brand-name">Cookies Manager</span>
    </header>

    <main>
      <section id="chooser">
        <h2 class="section-title">Profil de nettoyage</h2>
        <ul id="profiles"></ul>
      </section>

      <section id="preview" hidden>
        <h2 class="section-title">Aperçu</h2>
        <ul id="preview-list"></ul>

        <label id="vault" class="callout" hidden>
          <span class="callout-title">Phrase secrète du coffre</span>
          <input type="password" id="passphrase" autocomplete="off" />
          <span class="hint">
            Les cookies supprimés seront sauvegardés chiffrés. Phrase oubliée = coffre
            définitivement illisible.
          </span>
          <span class="hint warn" id="vault-existing" hidden></span>
        </label>

        <label id="danger" class="callout danger" hidden>
          <span class="callout-row">
            <input type="checkbox" id="danger-check" />
            <span class="callout-title">Suppression définitive</span>
          </span>
          <span class="hint">
            Ce profil efface des mots de passe ou des données de formulaire. Aucune exclusion par
            site n'est possible, et rien n'est récupérable.
          </span>
        </label>

        <div class="actions">
          <button id="confirm" class="primary" type="button">Nettoyer</button>
          <button id="cancel" type="button">Annuler</button>
        </div>
      </section>

      <section id="report" hidden>
        <h2 class="section-title">Nettoyage terminé</h2>
        <p id="report-summary" class="summary"></p>
        <ul id="report-list"></ul>

        <div id="spared" hidden>
          <h3 class="section-title">Sites épargnés</h3>
          <ul id="spared-list" class="chips"></ul>
        </div>

        <div class="actions">
          <button id="done" type="button">Retour aux profils</button>
        </div>
      </section>
    </main>

    <footer>
      <a href="options.html" target="_blank">Configurer les profils et la keep-list</a>
    </footer>

    <script type="module" src="/src/ui/popup/popup.ts"></script>
  </body>
</html>
